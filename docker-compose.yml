# Sentinel-X — `lite` profile (docs/08 §A.4): Postgres, Redis, API, web console.
# Later phases add OpenSearch, Qdrant (lite) and Neo4j, Redpanda, MinIO, observability (`--profile full`).
#
#   make keys                                  # RS256 signing key → ./.secrets
#   SENTINELX_BOOTSTRAP_ADMIN_PASSWORD=... docker compose up --build
#   open http://localhost:8080

name: sentinel-x

x-backend-env: &backend-env
  SENTINELX_ENVIRONMENT: production
  SENTINELX_DATABASE_URL: postgresql+asyncpg://sentinelx:${POSTGRES_PASSWORD:-sentinelx}@postgres:5432/sentinelx
  SENTINELX_REDIS_URL: redis://redis:6379/0
  SENTINELX_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private_key
  SENTINELX_CORS_ORIGINS: '["http://localhost:8080"]'
  SENTINELX_COOKIE_SECURE: "true"
  SENTINELX_EXPOSE_API_DOCS: "false"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sentinelx
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinelx}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]

  migrate:
    build: ./backend
    command: ["sh", "-c", "sentinelx migrate && sentinelx seed --admin-email \"$$SENTINELX_BOOTSTRAP_ADMIN_EMAIL\""]
    environment:
      <<: *backend-env
      SENTINELX_BOOTSTRAP_ADMIN_EMAIL: ${SENTINELX_BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      SENTINELX_BOOTSTRAP_ADMIN_PASSWORD: ${SENTINELX_BOOTSTRAP_ADMIN_PASSWORD:?set SENTINELX_BOOTSTRAP_ADMIN_PASSWORD}
    secrets: [jwt_private_key]
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"
    networks: [data]

  api:
    build: ./backend
    environment: *backend-env
    secrets: [jwt_private_key]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [data, app]

  web:
    build: ./frontend
    ports:
      - "8080:8080"
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api: { condition: service_healthy }
    networks: [app]

secrets:
  jwt_private_key:
    file: ./.secrets/jwt_private.pem

volumes:
  postgres-data:
  redis-data:

networks:
  data:
    internal: true   # stores are never reachable from outside the compose network
  app:
