name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sentinelx_test
          POSTGRES_USER: sentinelx
          POSTGRES_PASSWORD: sentinelx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sentinelx" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SENTINELX_TEST_DATABASE_URL: postgresql+asyncpg://sentinelx:sentinelx@localhost:5432/sentinelx_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --extra otel
      - name: Lint & format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types (mypy --strict)
        run: uv run mypy app
      - name: Architecture contracts
        run: uv run lint-imports
      - name: SAST (bandit)
        run: uv run bandit -c pyproject.toml -r app -q
      - name: Dependency audit
        run: uv export --frozen --no-dev --no-hashes --extra otel > /tmp/requirements.txt && uv run pip-audit --strict -r /tmp/requirements.txt
      - name: Tests on PostgreSQL (coverage gate)
        run: uv run pytest --cov --cov-report=xml
      - name: OpenAPI contract is committed and current
        run: uv run sentinelx export-openapi --out openapi.json && git diff --exit-code openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API client matches the OpenAPI contract
        run: npm run gen:api && git diff --exit-code src/api/schema.d.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Filesystem & IaC scan (trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          load: true
          tags: sentinelx-api:ci
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          load: true
          tags: sentinelx-web:ci
      - name: Scan API image (trivy)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: sentinelx-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
