id: 2d7e9a41-8c05-4b63-9f1a-6e3c0b8d5f27
title: Burst of authentication failures for one account from one source
description: >
  Repeated failed logons for the same account from the same source within minutes: password guessing
  against a known account.
level: medium
tags:
  - attack.credential_access
  - attack.t1110.001
references:
  - https://attack.mitre.org/techniques/T1110/001/
falsepositives:
  - A user or service repeatedly using an expired password
match:
  class_uid: 3002
  status_id: 2
group_by:
  - src_endpoint.ip
  - user.name
threshold: 5
window: 5m
