id: 3f2a9c14-6b58-4d07-8e91-5c0a7d3b8e62
title: NTLM authentication tried for many accounts from one workstation
description: >
  A domain controller audited NTLM authentication for ten or more different accounts from the same
  workstation within ten minutes. That is the shape of password spraying: one source, many accounts, few
  attempts each. The audit record says which account was tried and from where; it does not say whether the
  authentication succeeded, so this counts attempts, not failures, and an analyst has to check the logon
  records for the outcome.
level: medium
tags:
  - attack.credential_access
  - attack.t1110.003
references:
  - https://attack.mitre.org/techniques/T1110/003/
match:
  class_uid: 3002
  auth_protocol: NTLM
group_by: [src_endpoint.hostname]
count_distinct: user.name
threshold: 10
window: 10m
falsepositives:
  - Vulnerability scanners and asset inventory tools that authenticate as many service accounts
  - A jump host or terminal server many people sign in from
  - Backup and monitoring agents that walk a list of accounts
