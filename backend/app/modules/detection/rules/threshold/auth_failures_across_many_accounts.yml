id: 4f8b2c6d-1a37-4e95-b0c2-7d6e9f1a3b58
title: Authentication failures across many accounts from one source
description: >
  One source failing to authenticate as several different accounts in a short time is the shape of
  password spraying. Works for any source that normalises to OCSF Authentication (sshd, Windows, ...).
level: medium
tags:
  - attack.credential_access
  - attack.t1110.003
references:
  - https://attack.mitre.org/techniques/T1110/003/
falsepositives:
  - A misconfigured service retrying stale credentials for several accounts
match:
  class_uid: 3002
  status_id: 2
group_by:
  - src_endpoint.ip
count_distinct: user.name
threshold: 4
window: 10m
